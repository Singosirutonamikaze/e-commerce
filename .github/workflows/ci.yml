name: CI - Intégration Continue & Assurance Qualité

on:
  push:
    branches:
      - main
      - development
      - staging
      - production
      - test
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - development
      - staging
      - production
      - test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validation du Code (Types, Linter, Tests Unitaires)
  # ---------------------------------------------------------------------------
  quality-check:
    name: Lint, Types & Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      DIRECT_URL: "postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-anon-key"
      SUPABASE_SERVICE_ROLE_KEY: "mock-service-role-key"
      SUPABASE_JWT_SECRET: "mock-jwt-secret"
      ADMIN_SETUP_SECRET: "mock-admin-secret"

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 📦 Installation de pnpm
        uses: pnpm/action-setup@v4

      - name: ⚡ Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: 🚀 Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: 🛡️ Validation du schéma Prisma & Génération du client
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate

      - name: 🔍 Vérification stricte des types TypeScript
        run: pnpm exec tsc --noEmit

      - name: 🧹 Analyse statique ESLint
        run: pnpm lint

      - name: 🧪 Exécution des tests unitaires Vitest
        run: pnpm test

  # ---------------------------------------------------------------------------
  # Job 2: Validation du Build Docker
  # ---------------------------------------------------------------------------
  docker-build-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: quality-check

    steps:
      - name: 📥 Récupération du dépôt
        uses: actions/checkout@v4

      - name: 🐳 Configuration de Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Construction de l'image Docker de Production
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: velure:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
